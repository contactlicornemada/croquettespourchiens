<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trouvez les croquettes adaptées</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f2eb;
      color: #29251f;
    }
    .container { width: min(1000px, 92%); margin: 0 auto; }
    header { text-align: center; padding: 55px 0 30px; }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 48px); }
    header p { color: #70695f; font-size: 17px; }
    .form-card, .results {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
      margin-bottom: 40px;
    }
    .field { margin-bottom: 22px; }
    label { display: block; font-weight: 700; margin-bottom: 9px; }
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8d1c7;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #29251f;
      color: white;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .status { margin-top: 15px; color: #70695f; text-align: center; }
    .results-head { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
    .results-head h2 { margin: 0; }
    .back { width: auto; padding: 10px 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .product {
      border: 1px solid #e7e0d6;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }
    .product-image {
      width: 100%; height: 190px; object-fit: contain; background: #f7f5f1;
    }
    .product-body { padding: 18px; }
    .tag { display: inline-block; font-size: 12px; padding: 5px 8px; border-radius: 20px; background: #eee8de; margin-bottom: 10px; }
    .product h3 { margin: 0 0 8px; }
    .product p { color: #686158; line-height: 1.5; font-size: 14px; }
    .empty { text-align: center; padding: 30px 10px; color: #70695f; }
    .error { color: #a33a2b; }
    @media (max-width: 600px) {
      .form-card, .results { padding: 20px; }
      .results-head { align-items: flex-start; flex-direction: column; }
      .back { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="container">
    <h1>Trouvez les croquettes adaptées</h1>
    <p>Répondez à 3 questions pour découvrir les produits correspondant à votre chien.</p>
  </header>

  <main class="container">
    <section id="formSection" class="form-card">
      <form id="recommendationForm">
        <div class="field">
          <label for="age">Âge du chien</label>
          <select id="age" required>
            <option value="">Sélectionner</option>
            <option value="Chiot">Chiot</option>
            <option value="Adulte">Adulte</option>
          </select>
        </div>

        <div class="field">
          <label for="size">Race / taille</label>
          <select id="size" required>
            <option value="">Sélectionner</option>
            <option value="Petite">Petite race</option>
            <option value="Petite-Moyenne">Petite à moyenne race</option>
            <option value="Moyenne">Moyenne race</option>
            <option value="Grande">Grande à très grande race</option>
          </select>
        </div>

        <div class="field">
          <label for="type">Qu'attendez-vous principalement de son alimentation ?</label>
          <select id="type" required>
            <option value="">Sélectionner</option>
            <option value="1">Une alimentation simple, complète et accessible</option>
            <option value="2">Une alimentation plus riche pour accompagner son énergie</option>
            <option value="3">Une nutrition premium plus ciblée et complète</option>
            <option value="4">Une formulation super-premium plus travaillée, avec moins d'ingrédients</option>
          </select>
        </div>

        <button id="submitBtn" type="submit">Voir les produits adaptés</button>
        <div id="formStatus" class="status"></div>
      </form>
    </section>

    <section id="resultsSection" class="results" hidden>
      <div class="results-head">
        <div>
          <h2>Produits adaptés</h2>
          <p id="resultsSummary"></p>
        </div>
        <button id="backBtn" class="back" type="button">Modifier mes réponses</button>
      </div>
      <div id="resultsGrid" class="grid"></div>
    </section>
  </main>

  <script src="engine.js"></script>
  <script>
    const formSection = document.getElementById('formSection');
    const resultsSection = document.getElementById('resultsSection');
    const form = document.getElementById('recommendationForm');
    const submitBtn = document.getElementById('submitBtn');
    const formStatus = document.getElementById('formStatus');
    const resultsGrid = document.getElementById('resultsGrid');
    const resultsSummary = document.getElementById('resultsSummary');
    const backBtn = document.getElementById('backBtn');

    function productCard(product) {
      const image = imageUrl(product.image);
      return `
        <article class="product">
          ${image ? `<img class="product-image" src="${escapeHtml(image)}" alt="${escapeHtml(product.name)}" onerror="this.style.display='none'">` : ''}
          <div class="product-body">
            <span class="tag">${escapeHtml(formatType(product.type))}</span>
            <h3>${escapeHtml(product.name)}</h3>
            <p>${escapeHtml(product.objective)}</p>
            <p><strong>${escapeHtml(product.dog_size)} · ${escapeHtml(product.dog_age)}</strong></p>
          </div>
        </article>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formStatus.className = 'status';
      formStatus.textContent = 'Recherche des produits...';
      submitBtn.disabled = true;

      try {
        const products = await getProducts();
        const age = document.getElementById('age').value;
        const size = document.getElementById('size').value;
        const type = document.getElementById('type').value;
        const matches = filterProducts(products, { age, size, type });

        formSection.hidden = true;
        resultsSection.hidden = false;
        resultsSummary.textContent = `${matches.length} produit${matches.length > 1 ? 's' : ''} correspond${matches.length > 1 ? 'ent' : ''} à vos critères.`;

        if (!matches.length) {
          resultsGrid.innerHTML = `<div class="empty">Aucun produit ne correspond exactement à ces critères.</div>`;
        } else {
          resultsGrid.innerHTML = matches.map(productCard).join('');
        }
      } catch (error) {
        formStatus.className = 'status error';
        formStatus.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    backBtn.addEventListener('click', () => {
      resultsSection.hidden = true;
      formSection.hidden = false;
      formStatus.textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
